# Temporary diagnostic: does GitHub's scheduler run workflows in this repo at all?
# Fires every 5 minutes and only prints the time. Remove once the scheduling issue is understood.
name: Schedule canary

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Canary fired at $(date -u +%H:%M:%S) UTC (event ${{ github.event_name }})"
