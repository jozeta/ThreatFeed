name: CI

on:
  # Pull requests only: running on branch pushes too made every PR update run twice.
  # main is covered by the deploy workflow, which runs the same checks.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
