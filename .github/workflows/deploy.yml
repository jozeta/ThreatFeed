name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the feed snapshot (and redeploy) every 30 minutes, at :07 and :37. GitHub delays or drops
    # scheduled runs at busy times like the top and half of the hour, so avoid :00 and :30.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # A second copy of the trends history (the published trends.json is the first), for runs that can't read it
      - uses: actions/cache/restore@v6
        with:
          path: .cache/trends.json
          key: trends-${{ github.run_id }}
          restore-keys: trends-
      - uses: actions/cache/restore@v6
        with:
          path: .cache/stats.json
          key: stats-${{ github.run_id }}
          restore-keys: stats-
      # A second copy of the published RSS feeds and their ledger, for runs that can't read the published ones
      - uses: actions/cache/restore@v6
        with:
          path: .cache/feeds/
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      # Fetch every default feed server-side plus CISA KEV / EPSS data into public/data/snapshot.json.
      # A failed snapshot shouldn't block a deploy: the app falls back to live fetching without it.
      - run: npm run snapshot
        continue-on-error: true
        env:
          # Carries ransomware victim history over between runs (the API only returns the latest ~100), and the
          # article text (data/content/<day>.json) of the last 30 days
          PREVIOUS_SNAPSHOT_URL: https://jozeta.github.io/ThreatFeed/data/snapshot.json
          # Lets the next run ask NVD only for CVEs changed since this one, instead of ~40 MB every time
          PREVIOUS_NVD_CACHE_URL: https://jozeta.github.io/ThreatFeed/data/nvd-cache.json
          # Carries older Patch Tuesday months over, so their ~30 MB MSRC documents aren't refetched every run
          PREVIOUS_MSRC_URL: https://jozeta.github.io/ThreatFeed/data/msrc.json
          # Carries actor and malware profiles over between the daily ATT&CK and Malpedia refreshes
          PREVIOUS_ACTORS_URL: https://jozeta.github.io/ThreatFeed/data/actors.json
          # Carry the npm advisories and the last 30 days of npm malware over, so each run asks GitHub only for
          # advisories updated since the last one (a handful of requests). A missing file means a one-time full
          # backfill: about 85 requests for every reviewed npm advisory and 10 to 100 for 30 days of malware (it comes in waves)
          PREVIOUS_NPM_URL: https://jozeta.github.io/ThreatFeed/data/npm-advisories.json
          PREVIOUS_NPM_MALWARE_URL: https://jozeta.github.io/ThreatFeed/data/npm-malware.json
          # The RSS feeds link to the site and read their published-items ledger (feeds/seen.json) back
          FEED_SITE_URL: https://jozeta.github.io/ThreatFeed/
          # The cached copy of the ledger: used when the published one can't be read, or is older
          PREVIOUS_FEEDS_LEDGER_FILE: .cache/feeds/seen.json
          # The trends history accumulates here: each run recounts the last three days and keeps two years.
          # The script builds on the newer of the two copies and writes nothing if it can read neither
          PREVIOUS_TRENDS_URL: https://jozeta.github.io/ThreatFeed/data/trends.json
          PREVIOUS_TRENDS_FILE: .cache/trends.json
          # The daily-count history for the dashboards (400 days), carried over the same way
          PREVIOUS_STATS_URL: https://jozeta.github.io/ThreatFeed/data/stats.json
          PREVIOUS_STATS_FILE: .cache/stats.json
          # Optional (repo secret): a free NVD API key allows 10x the request rate. Empty is fine.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Raises the GitHub Advisory Database API limit from 60 to 1000+ requests an hour (read-only use)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The trends history exists only in the published site and the cache, and a deploy replaces the whole site.
      # If the snapshot didn't write trends.json, put the published (or cached) copy back; if neither is there
      # and the site isn't simply without one yet (404), stop before deploying so the old site keeps serving.
      - name: Keep the trends history
        run: |
          f=public/data/trends.json
          valid() { [ -s "$1" ] && node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!d||typeof d.days!=='object')process.exit(1)" "$1" 2>/dev/null; }
          if valid "$f"; then exit 0; fi
          mkdir -p public/data
          code=000
          for i in 1 2 3; do
            code=$(curl -sS -L -o "$f.tmp" -w '%{http_code}' --max-time 60 https://jozeta.github.io/ThreatFeed/data/trends.json) || true
            if [ "$code" = 200 ] && valid "$f.tmp"; then mv "$f.tmp" "$f"; echo "Restored the published trends.json"; exit 0; fi
            [ "$code" = 404 ] && break
            sleep 15
          done
          rm -f "$f.tmp"
          if valid .cache/trends.json; then cp .cache/trends.json "$f"; echo "Restored trends.json from the Action cache"; exit 0; fi
          if [ "$code" = 404 ]; then echo "No trends.json published yet"; exit 0; fi
          echo "::error::trends.json is missing and the published copy couldn't be fetched (HTTP $code); not deploying, so the history isn't lost"
          exit 1
      # The stats history exists only in the published site and the cache, and a deploy replaces the whole site.
      # If the snapshot didn't write stats.json, put the published (or cached) copy back; if neither is there
      # and the site isn't simply without one yet (404), stop before deploying so the old site keeps serving.
      - name: Keep the stats history
        run: |
          f=public/data/stats.json
          valid() { [ -s "$1" ] && node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!d||typeof d.days!=='object')process.exit(1)" "$1" 2>/dev/null; }
          if valid "$f"; then exit 0; fi
          mkdir -p public/data
          code=000
          for i in 1 2 3; do
            code=$(curl -sS -L -o "$f.tmp" -w '%{http_code}' --max-time 60 https://jozeta.github.io/ThreatFeed/data/stats.json) || true
            if [ "$code" = 200 ] && valid "$f.tmp"; then mv "$f.tmp" "$f"; echo "Restored the published stats.json"; exit 0; fi
            [ "$code" = 404 ] && break
            sleep 15
          done
          rm -f "$f.tmp"
          if valid .cache/stats.json; then cp .cache/stats.json "$f"; echo "Restored stats.json from the Action cache"; exit 0; fi
          if [ "$code" = 404 ]; then echo "No stats.json published yet"; exit 0; fi
          echo "::error::stats.json is missing and the published copy couldn't be fetched (HTTP $code); not deploying, so the history isn't lost"
          exit 1
      # If a failed snapshot left msrc.json, actors.json, entities.json, npm-advisories.json or npm-malware.json missing
      # or empty, deploy the published copies rather than a site without Patch Tuesday, actor data, entity links or npm data. Best effort: this step never fails the run.
      - name: Keep the published Patch Tuesday, actor, entity and npm advisory data
        continue-on-error: true
        run: |
          mkdir -p public/data
          for name in msrc actors entities npm-advisories npm-malware; do
            f=public/data/$name.json
            [ -s "$f" ] && continue
            if curl -sS -fL --retry 3 --retry-delay 15 --max-time 120 -o "$f.tmp" "https://jozeta.github.io/ThreatFeed/data/$name.json" && [ -s "$f.tmp" ]; then
              mv "$f.tmp" "$f"; echo "Restored the published $name.json"
            else
              rm -f "$f.tmp"; echo "::warning::$name.json is missing and the published copy couldn't be fetched"
            fi
          done || true
      # The article text (content shards, one file per publish day) is carried over from the published site by the
      # snapshot. If the snapshot failed, or wrote none because a previous shard couldn't be read (it then leaves
      # the directory empty), deploy the published last 30 days rather than a site whose reader
      # shows only descriptions. Best effort: missing days (404) are skipped and this step never fails the run.
      - name: Keep the published content shards
        continue-on-error: true
        run: |
          dir=public/data/content
          [ -n "$(ls -A "$dir" 2>/dev/null)" ] && exit 0
          mkdir -p "$dir"
          kept=0
          for i in $(seq 0 30); do
            day=$(date -u -d "-$i day" +%Y-%m-%d)
            if curl -sfL --retry 2 --retry-delay 10 --max-time 60 -o "$dir/$day.json.tmp" "https://jozeta.github.io/ThreatFeed/data/content/$day.json" && [ -s "$dir/$day.json.tmp" ]; then
              mv "$dir/$day.json.tmp" "$dir/$day.json"; kept=$((kept + 1))
            else
              rm -f "$dir/$day.json.tmp"
            fi
          done
          echo "Restored $kept published content shards"
      # The ledger (feeds/seen.json) exists only in the published site and the cache, and a deploy replaces the
      # whole site; without it the next run would start over and re-date every item. If the snapshot wrote no
      # feeds, put the published (or cached) set of four back, all or none. If neither is there and the site
      # isn't simply without feeds yet (404), stop before deploying so the old site keeps serving.
      - name: Keep the published RSS feeds
        run: |
          dir=public/data/feeds
          names="seen.json news.xml vulns.xml ransomware.xml"
          valid() { [ -s "$1" ] && node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!d||d.version!==1||typeof d.feeds!=='object')process.exit(1)" "$1" 2>/dev/null; }
          complete() { for n in $names; do [ -s "$1/$n" ] || return 1; done; valid "$1/seen.json"; }
          complete "$dir" && exit 0
          mkdir -p "$dir"
          tmp=$(mktemp -d)
          code=000
          for i in 1 2 3; do
            rm -f "$tmp"/*
            fetched=1
            for n in $names; do
              c=$(curl -sS -L -o "$tmp/$n" -w '%{http_code}' --max-time 120 "https://jozeta.github.io/ThreatFeed/data/feeds/$n?t=$(date +%s)") || c=000
              [ "$n" = seen.json ] && code=$c
              if [ "$c" != 200 ]; then fetched=0; break; fi
            done
            if [ "$fetched" = 1 ] && complete "$tmp"; then for n in $names; do mv "$tmp/$n" "$dir/$n"; done; echo "Restored the published feeds"; exit 0; fi
            [ "$code" = 404 ] && break
            sleep 15
          done
          if complete .cache/feeds; then for n in $names; do cp ".cache/feeds/$n" "$dir/$n"; done; echo "Restored the feeds from the Action cache"; exit 0; fi
          # Never deploy part of a set: feeds without their ledger would be re-dated by the next run
          for n in $names; do rm -f "$dir/$n"; done
          if [ "$code" = 404 ]; then echo "No feeds published yet"; exit 0; fi
          echo "::error::feeds/seen.json is missing and the published feeds couldn't be fetched (seen.json: HTTP $code) or restored from the cache; not deploying, so the ledger isn't lost"
          exit 1
      - name: Copy the trends history for the cache
        if: hashFiles('public/data/trends.json') != ''
        run: mkdir -p .cache && cp public/data/trends.json .cache/trends.json
      # One cache entry per run is expected: restore picks the newest (trends- prefix) and GitHub evicts
      # entries not used for 7 days, so they don't pile up
      - uses: actions/cache/save@v6
        if: hashFiles('public/data/trends.json') != ''
        with:
          path: .cache/trends.json
          key: trends-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Copy the stats history for the cache
        if: hashFiles('public/data/stats.json') != ''
        run: mkdir -p .cache && cp public/data/stats.json .cache/stats.json
      - uses: actions/cache/save@v6
        if: hashFiles('public/data/stats.json') != ''
        with:
          path: .cache/stats.json
          key: stats-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Copy the RSS feeds for the cache
        if: hashFiles('public/data/feeds/seen.json') != ''
        run: mkdir -p .cache/feeds && cp public/data/feeds/seen.json public/data/feeds/*.xml .cache/feeds/
      - uses: actions/cache/save@v6
        if: hashFiles('public/data/feeds/seen.json') != ''
        with:
          path: .cache/feeds/
          key: feeds-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
