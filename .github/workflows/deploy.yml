name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the feed snapshot (and redeploy) every 30 minutes, at :07 and :37. GitHub delays or drops
    # scheduled runs at busy times like the top and half of the hour, so avoid :00 and :30.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Fetch every default feed server-side plus CISA KEV / EPSS data into public/data/snapshot.json.
      # A failed snapshot shouldn't block a deploy: the app falls back to live fetching without it.
      - run: npm run snapshot
        continue-on-error: true
        env:
          # Carries ransomware victim history over between runs (the API only returns the latest ~100)
          PREVIOUS_SNAPSHOT_URL: https://jozeta.github.io/ThreatFeed/data/snapshot.json
          # Raises the GitHub Advisory Database API limit from 60 to 1000+ requests an hour (read-only use)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
